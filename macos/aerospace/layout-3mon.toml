# Layout fragment — THREE screens. Merged into aerospace.base.toml by
# apply-layout.py. Section markers must stay exactly as written.

# ---8<--- PERSISTENT_WORKSPACES
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# ---8<--- MONITOR_ASSIGNMENT
[workspace-to-monitor-force-assignment]
# Nine workspaces in three "desktops" of three, so alt-1/2/3 below switch every
# screen at once and the monitors behave as a single unit. Ported from
# windows/glazewm/config.yaml, which solved this first.
#
#   desktop 1 = 1 2 3   terminal and editors
#   desktop 2 = 4 5 6   chat and music
#   desktop 3 = 7 8 9   browsers
#
# THREE SCREENS IS NOW THE LID-OPEN CASE. The desk runs in clamshell on two
# panels (see layout-2mon.toml, the everyday layout); open the MacBook there and
# it becomes the third. So the mapping this file has to serve is:
#
#   column A (side)     ws 1,4,7   Mancer TE-3217G, in portrait
#   column B (primary)  ws 2,5,8   'main' — the Alienware AW3225QF
#   column C (third)    ws 3,6,9   the MacBook's own panel
#
# ONE MONITOR IS NAMED HERE, WHICH THE TWO-SCREEN FILE DELIBERATELY AVOIDS.
# With two panels 'main' and 'secondary' partition them exactly, so roles alone
# were enough. With three, 'secondary' matches BOTH non-main screens and cannot
# tell column A from column C — a name is unavoidable. The rule that keeps it
# safe: only ever name a screen that is never the primary one. Naming the
# monitor that later becomes 'main' collides with column B and piles all nine
# workspaces onto one screen. That has happened twice.
#
# Which makes the Alienware the designated primary. It is the only panel here
# with no name in this table, so it is the only one that can hold the menu bar
# without a collision. Move the menu bar somewhere else and the names below have
# to move with it.
#
# Patterns are REGEXES matched against the monitor name (case-insensitive), not
# literal names, and anchoring matters: `MSI MAG271C` was a prefix of
# `MSI MAG271CQR` and grabbed the wrong panel. Check what this machine reports
# with: aerospace list-monitors
#
# `persistent-workspaces` at the top of this file is what GlazeWM calls
# keep_alive: without it an empty member of a desktop would be deactivated, and
# the next alt-<n> would restore only the screens that still had a window.

# column A — the side panel: the portrait Mancer. The fallbacks behind it keep
# this file usable on a desk it was not written for — 'secondary' for any other
# pair, 'built-in' for the laptop on its own.
1 = ['^TE-3217G$', 'secondary', 'built-in']
4 = ['^TE-3217G$', 'secondary', 'built-in']
7 = ['^TE-3217G$', 'secondary', 'built-in']

# column B — the primary screen, wherever the menu bar is
2 = 'main'
5 = 'main'
8 = 'main'

# column C — the third panel: the MacBook, whose lid being open is what makes
# this a three-screen desk in the first place. Falls back to 'main' rather than
# to 'secondary', because a 'secondary' here would race column A for the same
# screen; sharing with column B is the visible, recoverable failure, and it is
# the one the two-screen layout already lives with.
3 = ['built-in', 'main']
6 = ['built-in', 'main']
9 = ['built-in', 'main']

# ---8<--- WORKSPACE_BINDINGS
# Switch all three monitors at once — one keypress, one desktop, three screens.
# Each binding focuses the whole trio: left, then right, then CENTRE. Centre
# goes last on purpose, because focusing a workspace follows focus to its
# monitor, so ending there leaves the keyboard on the Alienware rather than on
# whichever screen happened to be last in the list.
alt-1 = ['workspace 1', 'workspace 3', 'workspace 2']   # terminal and editors
alt-2 = ['workspace 4', 'workspace 6', 'workspace 5']   # chat and music
alt-3 = ['workspace 7', 'workspace 9', 'workspace 8']   # browsers

# Escape hatch: move ONE screen to one workspace, leaving the other two where
# they are — for when you want the browser on the right panel while the editors
# stay put. An alt-1/2/3 afterwards re-syncs all three.
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

# ---8<--- APP_RULES
    # Apps land on the column that suits them, not all on one screen.
    # Column B (2/5/8) is the primary display and takes what you type into;
    # column A (1/4/7) is the side panel and takes what you glance at.
    #
    # The terminal and the IDE are deliberately on DIFFERENT columns. Sharing
    # one workspace meant an IDE with a third of a screen and reaching for
    # alt-f to compensate — which never held, because AeroSpace fullscreen is
    # "the focused window covers the workspace", not a maximised state, and
    # 0.21.3 has no setting to make it persist (checked every config key in the
    # binary). One window per workspace is the answer the [gaps] block below
    # already assumes.
    #
    # Each slot lists EVERY app you actually open for that job — a slot with one
    # app in it is the same as having no rule the day you switch tools.
    { if.app-id = 'com.mitchellh.ghostty',       run = 'move-node-to-workspace 1 --focus-follows-window' },
    { if.app-id = 'com.toggl.focus.desktop',     run = 'move-node-to-workspace 1 --focus-follows-window' },

    # Hoppscotch is pinned to ws 1 — the side column of the WORK desktop, next
    # to the terminal, not to a browser. It used to live on ws 7 (side column of
    # the browser desktop) on the theory that it is read alongside a browser;
    # in practice it is read alongside the thing making the request. Keeping the
    # same number in both layouts also means it lands in the same place whether
    # the lid is open or shut.
    { if.app-id = 'io.hoppscotch.desktop',       run = 'move-node-to-workspace 1 --focus-follows-window' },

    { if.app-id = 'com.microsoft.VSCode',        run = 'move-node-to-workspace 2 --focus-follows-window' },
    { if.app-id = 'com.google.android.studio',   run = 'move-node-to-workspace 2 --focus-follows-window' },
    { if.app-id = 'com.jetbrains.intellij',      run = 'move-node-to-workspace 2 --focus-follows-window' },

    # Teams and Slack own the side column outright, stacked one above the other:
    # that column is the Mancer in portrait (1440x2560), where
    # `default-root-container-orientation = 'auto'` resolves to a VERTICAL split,
    # so two windows there are already a top and a bottom half. Chat is the one
    # thing that reads better tall than wide, and it is what the panel is for.
    #
    # The second command in each rule is what makes it Teams ON TOP rather than
    # whichever of the two you happened to open first. `on-window-detected` has
    # no way to say "insert at position 0", so the window is placed and then
    # nudged: Teams one step up, Slack one step down. Both are no-ops once the
    # window is already at that end, which is why `--boundaries-action stop`
    # matters — the default there is `create-implicit-container`, and that would
    # wrap the window in a nested container instead of leaving it alone.
    #
    # KEEP EACH RULE ON ONE LINE. apply-layout.py's re-home step reads these with
    # a line-oriented regex; a rule split across lines is a rule it silently
    # skips, and the app then keeps whatever workspace the old layout gave it.
    #
    # On the road the same workspace is the MacBook's own panel, which is
    # landscape — 'auto' splits horizontally there and the two land side by side,
    # with the up/down nudges doing nothing. Fine: the pairing is the point, the
    # orientation is the monitor's business.
    { if.app-id = 'com.microsoft.teams2', run = ['move-node-to-workspace 4 --focus-follows-window', 'move --boundaries workspace --boundaries-action stop up'] },
    { if.app-id = 'com.tinyspeck.slackmacgap', run = ['move-node-to-workspace 4 --focus-follows-window', 'move --boundaries workspace --boundaries-action stop down'] },

    # Everything else on the chat desktop goes to the wide primary screen.
    { if.app-id = 'com.anthropic.claudefordesktop', run = 'move-node-to-workspace 5 --focus-follows-window' },
    { if.app-id = 'com.openai.codex',            run = 'move-node-to-workspace 5 --focus-follows-window' },
    { if.app-id = 'net.whatsapp.WhatsApp',       run = 'move-node-to-workspace 5 --focus-follows-window' },
    { if.app-id = 'com.spotify.client',          run = 'move-node-to-workspace 5 --focus-follows-window' },

    # Column A of the BROWSER desktop — the one slot that was empty in both
    # layouts. Notion is reference material: you read it while doing something
    # else, which is exactly what column A is for, and on the Mancer in portrait
    # a document gets the full 1440x2560 instead of half a wide screen.
    #
    # NOT on ws 1 next to the terminal, which is where Hoppscotch ended up for
    # the opposite reason: Hoppscotch is read alongside the thing making the
    # request, and Notion is not tied to anything you are running.
    #
    # The bundle id really is `notion.id` — no reverse-DNS, no vendor prefix.
    # Checked three ways (mdls, the Info.plist, and `aerospace list-apps` against
    # the running app) precisely because it looks like a placeholder somebody
    # forgot to replace, and per the note above a wrong id fails SILENTLY.
    { if.app-id = 'notion.id',                   run = 'move-node-to-workspace 7 --focus-follows-window' },

    { if.app-id = 'com.google.Chrome',           run = 'move-node-to-workspace 8 --focus-follows-window' },
    { if.app-id = 'com.apple.Safari',            run = 'move-node-to-workspace 8 --focus-follows-window' },
    { if.app-id = 'org.mozilla.firefoxdeveloperedition', run = 'move-node-to-workspace 8 --focus-follows-window' },
