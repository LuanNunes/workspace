# AeroSpace BASE — everything that does not depend on how many screens are
# plugged in. This file is NOT read by AeroSpace: apply-layout.py merges it with
# one of the layout-*.toml fragments and writes aerospace.toml, which is what
# ~/.config/aerospace/aerospace.toml points at.
#
# Same shape as windows/windows-terminal/, which solved this first: a base, a
# set of variants, and a script that merges them. The AeroSpace config format
# has no `include`, so without this the two layouts would be two ~300-line files
# differing in about forty, and they would drift.
#
# Four placeholders below are filled from the fragment. Everything else — focus
# and move bindings, the service mode, floating rules, gaps — lives here once.
#
# AeroSpace — symlinked to ~/.config/aerospace/aerospace.toml
#
# i3-like tiling for macOS, without disabling SIP. Reload after editing:
#   aerospace reload-config
# Full command reference: https://nikitabobko.github.io/AeroSpace/commands
#
# NOTE ON MODIFIERS: AeroSpace grabs its bindings system-wide, BEFORE the focused
# app sees them. So every `alt-<key>` below is permanently unavailable to zsh,
# Neovim and fzf. That's why `alt-c` is deliberately NOT bound — fzf's cd-widget
# owns it. Check this file before adding a binding.
#
# `ctrl-w` (close, further down) is the one binding here that does not use alt,
# and it pays the same toll: zsh loses backward-kill-word and Neovim loses its
# window prefix. Keep it the only ctrl- binding — ctrl is where the terminal
# keeps everything, and alt at least had spare keys.

# Schema version of this file. Without it AeroSpace assumes 1 and warns on every
# start. https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

start-at-login = true

# Version 2's one breaking change: v1 inferred which workspaces survive an empty
# screen from the keybindings below, so alt-1…alt-9 persisted for free. In v2 the
# fallback is an empty array and this list is the source of truth — without it,
# a workspace would vanish the moment its last window closes. Keep it in sync
# with the `alt-<n> = 'workspace <n>'` bindings further down.
@@PERSISTENT_WORKSPACES@@

# macOS "Displays have separate Spaces" fights any tiler: it gives each display
# its own animated Space and re-parents windows behind the WM's back. Turn it
# off in System Settings → Desktop & Dock → Mission Control, then log out.
after-login-command = []

# A colored outline on the focused window — the only way to tell focus apart in
# a gapless tile. Colors are Rosé Pine (iris / overlay), matching Ghostty.
#
# hidpi=on is not cosmetic. Without it borders draws at non-retina resolution,
# and on a HiDPI panel that produced a visible flicker — traced on 2026-09-08 by
# killing borders (flicker stopped) and restarting it with the flag (it did not
# come back).
#
# The Mancer TE-3217G is the one panel here that is NOT HiDPI: at 24" its native
# 2560x1440 already lands near the MacBook's density, so it runs 1:1 and a HiDPI
# mode would halve the usable area. The flag stays on regardless — it is the
# screen that showed the flicker that decides, and turning it off to suit the
# Mancer would bring the flicker back on the Alienware.
#
# NOTE: this list runs when the AeroSpace SERVER starts, not on reload-config.
# Changing it here does nothing until AeroSpace itself is restarted; to apply it
# now, re-run the borders command by hand — a second invocation updates the
# running process rather than starting another.
after-startup-command = [
    'exec-and-forget borders active_color=0xffc4a7e7 inactive_color=0xff26233a width=6.0 hidpi=on',
]

# ===========================================================================
#  Layout
# ===========================================================================
# 'auto' splits along the longer edge — horizontal on a wide display, vertical
# on the built-in one. Beats hardcoding a direction on a laptop + monitor setup.
#
# It is resolved ONCE, when a workspace's root container is created, and never
# again: move that workspace to a screen of a different shape and it keeps the
# orientation it was born with, and `flatten-workspace-tree` does not reset it.
# So this setting decides the FIRST split of a workspace, not its split today —
# see the alt-shift-j/k note below for the key that fixes one up by hand.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# How much of a stacked window peeks out in accordion layout.
accordion-padding = 30

# Mouse follows focus, so the cursor is always over the window you just jumped
# to — otherwise hover-sensitive UI (and scrolling) targets the wrong window.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# ===========================================================================
#  Floating rules
# ===========================================================================
# Anything that is a dialog, a palette or a preferences pane is worse when
# tiled. Find an app's id with: `aerospace list-apps`
#
# THIS BLOCK MUST STAY ABOVE EVERY `[section]` HEADER. `on-window-detected` is a
# root-level key, and in TOML every key after a header belongs to that header's
# table until the next one. Sitting below `[key-mapping]` it was read as
# `key-mapping.on-window-detected` — "Unknown key", and the whole config failed
# to parse, so none of these rules ever ran.
#
# Every id below was read off the installed .app with
# `mdls -name kMDItemCFBundleIdentifier -raw /Applications/<name>.app`. Do the
# same for anything you add — AeroSpace does NOT warn about an id that matches
# no app, the rule just silently never fires. That is what made the browser and
# chat rules below look broken for months.
on-window-detected = [
    { if.app-id = 'com.apple.systempreferences', run = 'layout floating' },
    { if.app-id = 'com.apple.finder',            run = 'layout floating' },
    { if.app-id = 'com.apple.ActivityMonitor',   run = 'layout floating' },
    { if.app-id = 'com.apple.AddressBook',       run = 'layout floating' },
    { if.app-id = 'com.apple.iCal',              run = 'layout floating' },
    { if.app-id = 'com.raycast.macos',           run = 'layout floating' },
    { if.app-id = 'com.jetbrains.toolbox',       run = 'layout floating' },
    { if.app-id = 'dev.orbstack.OrbStack',       run = 'layout floating' },
    { if.app-id = 'org.pqrs.Karabiner-Elements.Settings', run = 'layout floating' },

    # Popups and one-shot panels. Tiling these steals half the screen from real
    # work every time they appear.
    { if.app-id = 'com.bitwarden.desktop',       run = 'layout floating' },
    { if.app-id = 'org.p0deje.Maccy',            run = 'layout floating' },
    { if.app-id = 'com.lujjjh.LinearMouse',      run = 'layout floating' },
    { if.app-id = 'com.ookla.speedtest-macos',   run = 'layout floating' },
    { if.app-id = 'eu.exelban.Stats',            run = 'layout floating' },
    { if.app-id = 'com.apple.UserNotificationCenter', run = 'layout floating' },

    # -----------------------------------------------------------------------
    # WHICH APP LIVES WHERE. The rules themselves are in the layout fragment,
    # because their workspace NUMBERS change with the screen count. The
    # reasoning is here, because none of it does.
    #
    # It used to be copied into each fragment: 51 of layout-2mon.toml's 84
    # comment lines existed verbatim in layout-3mon.toml, one run of them 36
    # lines long. That is the drift this base+fragment split exists to prevent,
    # and by 2026-09-11 it had already produced a paragraph that was wrong in
    # two files at once — see the note on the nudges below.
    #
    # TWO COLUMNS, whatever the numbers. Column A is the SIDE panel and takes
    # what you glance at; column B is the PRIMARY display and takes what you
    # type into. The terminal and the IDE are deliberately apart: sharing one
    # workspace meant an IDE with a third of a screen and reaching for alt-f to
    # compensate, which never held, because AeroSpace fullscreen is "the focused
    # window covers the workspace", not a maximised state, and 0.21.3 has no
    # setting to make it persist (checked every config key in the binary). One
    # window per workspace is what the [gaps] block below already assumes.
    #
    # Each slot lists EVERY app you actually open for that job — a slot with one
    # app in it is the same as having no rule the day you switch tools.
    #
    # TEAMS AND SLACK are the one pair meant to SHARE a workspace, stacked one
    # above the other on the side column. Chat is the one thing that reads
    # better tall than wide, and on the portrait Mancer (1440x2560) two windows
    # there are a top and a bottom half. The trailing `move up` / `move down` in
    # those two rules is ORDERING ONLY — `on-window-detected` cannot say "insert
    # at position 0", so Teams is nudged one step up and Slack one step down,
    # and `--boundaries-action stop` keeps a nudge with nowhere to go from
    # wrapping the window in a nested container.
    #
    # WHAT THE NUDGES DO NOT DO IS CREATE THE VERTICAL SPLIT. Both fragments
    # used to claim they landed in a vertical container because `auto` resolves
    # vertical on a portrait screen. It does not: `auto` is resolved ONCE, when
    # the workspace's root container is created, against whatever monitor it was
    # on then (see default-root-container-orientation above). A workspace born
    # on a landscape screen stays horizontal on the Mancer, both nudges become
    # no-ops, and Teams and Slack sit side by side until alt-shift-j makes the
    # split vertical. Diagnosed on 2026-09-11 with exactly that on screen.
    #
    # KEEP EACH RULE ON ONE LINE. apply-layout.py's re-home step reads these
    # with a line-oriented regex; a rule split across lines is a rule it
    # silently skips, and the app then keeps whatever workspace the old layout
    # gave it.
    #
    # HOPPSCOTCH sits with the TERMINAL, not with a browser: it is read
    # alongside the thing making the request. NOTION is the opposite case and
    # takes column A of the browser desktop — reference material you read while
    # doing something else, and on the portrait panel a document gets the full
    # height instead of half a wide screen. Its bundle id really is `notion.id`:
    # no reverse-DNS, no vendor prefix, checked three ways (mdls, the
    # Info.plist, and `aerospace list-apps` against the running app) precisely
    # because it looks like a placeholder somebody forgot to replace — and per
    # the note above, a wrong id fails SILENTLY.
    # -----------------------------------------------------------------------
@@APP_RULES@@
]

# ===========================================================================
#  Sections — everything below here is inside a table, so no root-level key
#  (`on-window-detected`, `start-at-login`, …) may be added past this point.
# ===========================================================================
@@MONITOR_ASSIGNMENT@@

[gaps]
# `inner` separates tiled windows from each other — keep it, otherwise two
# windows share a hairline and you can't tell where one ends.
# `outer` is the margin against the screen edge, and it's 0 on purpose: with one
# window per workspace (the way this setup is meant to be used) the window then
# fills the display exactly like macOS native fullscreen, minus the native Space
# that breaks every alt-<n> binding.
inner.horizontal = 8
inner.vertical = 8
outer.left = 0
outer.right = 0
outer.bottom = 0
outer.top = 0

[key-mapping]
preset = 'qwerty'

# ===========================================================================
#  Main mode
# ===========================================================================
[mode.main.binding]

# --- launch -----------------------------------------------------------------
# NOT on alt-enter, which is where i3 and GlazeWM put it and where this lived
# until it collided with the IDE. ⌥⏎ is "Show Context Actions" in Rider and
# IntelliJ — the single most-used key in a JetBrains editor — and per the note
# at the top of this file AeroSpace swallows it system-wide, so the IDE never
# saw it. Pressing it over Rider spawned a terminal instead of the quick-fix
# menu. Shift is enough to get out of the way: JetBrains binds nothing to ⌥⇧⏎.
#
# `open -a`, not `open -na`: -n forces a NEW instance every press, which is why
# this used to pile up terminal windows. Plain -a raises the Ghostty that is
# already running (and the ws 1 rule pulls focus there), and only launches one
# when none exists. For a genuinely new window, Ghostty's own cmd+n / cmd+shift+n.
alt-shift-enter = 'exec-and-forget open -a Ghostty'

# --- focus / move (i3 hjkl) -------------------------------------------------
# HORIZONTAL crosses monitors, VERTICAL does not, and the asymmetry is the whole
# point. The columns of this desk are arranged side by side, so left/right is
# the axis that means "next screen"; up/down only ever means "the other window
# in this workspace".
#
# `--boundaries all-monitors-outer-frame` on h/l is not decoration. A bare
# `focus left` defaults to `--boundaries workspace`, so the focus never leaves
# the screen you are on: on a workspace holding two windows it just bounces
# between them, which reads as "hjkl is stuck on this monitor". Traced on
# 2026-09-10 — with focus on the Alienware, `aerospace focus left` did nothing,
# and the same command with this flag landed on the Mancer.
#
# j/k got that same flag on 2026-09-10 and it was wrong, which only showed with
# the lid open. The MacBook sits physically BELOW the externals, so on three
# screens `alt-j` stopped meaning "the window under this one" and started
# meaning "fall off onto the laptop panel" — and `alt-shift-j` threw the window
# down there, silently changing its workspace number, because a window that
# lands on another monitor lands on that monitor's workspace. On the Mancer, in
# portrait with Teams above Slack, that is exactly the key you press to get from
# one to the other. `--boundaries workspace` is the default, and it is spelled
# out here so the next person does not "fix" the asymmetry back out.
#
# Nothing is lost: deliberate travel between panels is alt-ctrl-hjkl below,
# which acts on the DISPLAY and wraps around.
#
# The default boundaries-action, `stop`, is kept on all four: h/l walk the whole
# desk and then halt at its far edges, j/k halt at the ends of the workspace.
alt-h = 'focus --boundaries all-monitors-outer-frame left'
alt-j = 'focus --boundaries workspace down'
alt-k = 'focus --boundaries workspace up'
alt-l = 'focus --boundaries all-monitors-outer-frame right'

# Same boundaries on `move`, so a window travels exactly the path the focus
# does. On h/l, without the flag `move` stops at the workspace edge and
# alt-shift-l against the last window builds an implicit container instead of
# handing it to the monitor next door.
#
# ON J/K THE DEFAULT BOUNDARIES-ACTION IS THE FEATURE, NOT A BUG, and it was
# briefly deleted on 2026-09-11 by adding `--boundaries-action stop` here. In a
# workspace that is split HORIZONTALLY — two windows side by side — every window
# is already at the bottom of its container, so `down` is always a boundary hit:
# with `stop` the key becomes a silent no-op (exit 0, nothing moves), and with
# the default `create-implicit-container` the split flips to vertical and the
# window lands UNDER its neighbour. That second behaviour is the only way to say
# "put this one below that one" from the keyboard, and `stop` removed it.
#
# Which matters more than a portrait screen suggests, because
# `default-root-container-orientation = 'auto'` is resolved ONCE, when the
# workspace's root container is created, against the monitor it was on then —
# it is not re-evaluated when the workspace moves to another screen, and
# `flatten-workspace-tree` does not reset it either (both checked on
# 2026-09-11). So a trip with the lid open leaves ws 1/3/5 as h_tiles, and back
# at the desk they stay side by side on the portrait Mancer until something
# makes the split vertical. This key is that something; alt-slash, which toggles
# the container's own orientation, is the other.
#
# The cost is the one `stop` was reaching for: against the end of an ALREADY
# vertical stack of three or more, `move down` nests the window in a new
# container instead of doing nothing. Service mode `r` (flatten-workspace-tree)
# undoes that in one keystroke, and with the two windows per workspace this
# setup actually runs, AeroSpace re-orients the root rather than nesting.
#
# `--boundaries workspace` stays: that is the half of the 2026-09-10 fix that
# kept alt-shift-j from throwing a window down onto the laptop panel, and it is
# independent of the action taken at the boundary.
alt-shift-h = 'move --boundaries all-monitors-outer-frame left'
alt-shift-j = 'move --boundaries workspace down'
alt-shift-k = 'move --boundaries workspace up'
alt-shift-l = 'move --boundaries all-monitors-outer-frame right'

# Alternate between the last two WINDOWS. `alt-tab` below does the same for
# workspaces; this one is what you want when two apps share a workspace.
# Costs zsh its `alt-a` (unbound by default, so nothing real is lost) — see the
# note at the top of this file before adding any other alt-<key>.
alt-a = 'focus-back-and-forth'

# Cycle EVERY window of the current workspace, in tree order — the per-workspace
# cmd-tab macOS never had (its own is per-APP, and spans every workspace).
#
# `--boundaries workspace` is the whole point: a bare `dfs-next` walks off the
# end of this tree and into the next monitor's workspace, which is the exact
# behaviour this is meant to replace. `wrap-around-the-workspace` closes the
# ring, so holding the key cycles instead of stopping on the last window.
#
# This is the LOCAL switcher and AltTab (alt-tab) is the GLOBAL one — they are
# complementary, and it took removing AltTab to see it. This key only ever walks
# the workspace in front of you, and AeroSpace cannot do more: `focus dfs-next`
# refuses any other boundary, in as many words —
# "(dfs-next|dfs-prev) only supports --boundaries workspace".
alt-backtick = 'focus dfs-next --boundaries workspace --boundaries-action wrap-around-the-workspace'
alt-shift-backtick = 'focus dfs-prev --boundaries workspace --boundaries-action wrap-around-the-workspace'

# --- layout -----------------------------------------------------------------
alt-slash = 'layout tiles horizontal vertical'      # toggle split direction
alt-comma = 'layout accordion horizontal vertical'  # stack them instead
alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'              # pop this window out

# --- window lifecycle -------------------------------------------------------
# ctrl-w closes. Minimising has no binding here at all — it is left to macOS's
# own cmd+m, for the reason spelled out above alt-shift-m below. macOS already
# has cmd+w too, but cmd+w is per-app and inconsistent — some apps close a tab
# with it.
#
# Closing used to be alt-w, matching win+w in windows/glazewm/config.yaml (and
# SUPER+W on Omarchy), and moved off it on 2026-09-10: Option is the accent key
# on this keyboard, so writing Portuguese means living on the very modifier that
# closes windows — and with --quit-if-last-window below, one slip took the whole
# app down. Matching Windows is not worth losing a session to a mistyped "ação".
#
# ctrl-w is not free either, and it costs MORE than the alt-w it replaces.
# AeroSpace grabs it globally the same way it grabs alt (see the note at the top
# of this file), so it is gone from every app underneath: zsh loses
# `backward-kill-word` — the ⌃W every shell on every platform has — and Neovim
# loses ⌃W, its window-command prefix. That is the trade: a key used many times
# an hour in the terminal, against an app that disappears without being asked.
# If the shell half turns out to hurt more, ctrl-shift-w is unclaimed everywhere
# and is a one-line change.
#
# Nothing else here is on alt: unbinding alt-m on 2026-09-11 handed zsh back
# `copy-prev-shell-word`, and `alt-.` (insert-last-word) was never touched.
#
# --quit-if-last-window makes this behave the way it does on Windows and
# Omarchy: the app goes away with its last window, instead of lingering with an
# empty menu bar the way macOS apps normally do. Deliberate — an app you cannot
# see but is still running is exactly the state a tiling WM is meant to avoid.
#
# The cost is real on apps whose window IS the session: the last Ghostty window
# takes its shells with it, and the last browser window ends the browser. cmd+w
# is still there when you want to close a window and keep the app.
ctrl-w = 'close --quit-if-last-window'

# alt-m IS DELIBERATELY UNBOUND. It ran `macos-native-minimize` until
# 2026-09-11, and minimising takes the window OUT of the workspace tree: it
# lives in the Dock, AeroSpace stops seeing it, alt-backtick cannot find it
# because that only walks windows still in the tree, and AltTab cannot offer it
# because that lists windows. It was the one key in this config that produced a
# state neither switcher can see, and the failure it produced does not look like
# a minimised window — it looks like "cmd-tab stopped opening Chrome", because
# the browser had exactly one window and it was in the Dock. That was diagnosed
# three times before the key came off.
#
# Which does not mean the state goes away: cmd+m still minimises, and that is
# fine — it is macOS's key, pressed on purpose, and the Dock icon it produces is
# the affordance that brings the window back. What is gone is minimising by
# accident, from a tiling key next to alt-n and alt-comma.
#
# The way back when an app has NO window at all — the state cmd+w leaves Finder
# and Claude in, where both switchers have nothing to offer. A merely MINIMISED
# window does not need this key: AltTab lists it (`showMinimizedWindows`
# defaults to Show) and picking it restores it. What cannot help there is
# cmd+tab, which is macOS's own and activates an APP, never a window.
#
# It is also the answer to "I picked the app on cmd-tab and nothing came up".
# That switcher is macOS's own and activates an APP, never a window, so an app
# with only minimised windows — or none at all, which is where cmd+w leaves
# Finder and Claude — comes to the front with nothing to show. The Dock icon
# works because clicking it sends a REOPEN event instead. This is that event on
# a key.
#
# It is a script because both halves are Accessibility calls AeroSpace does not
# expose: clear AXMinimized on each window, and fall back to `open -b` when
# there is no window to clear it on. See macos/aerospace/raise-frontmost.sh.
alt-shift-m = 'exec-and-forget ~/.config/aerospace/raise-frontmost.sh'

# --- resize -----------------------------------------------------------------
# 150px per press, not 50. The step is in real pixels, so on a display this wide
# a 50px step needs ~10 presses before the split visibly moves — which reads as
# "the binding is broken".
alt-minus = 'resize smart -150'
alt-equal = 'resize smart +150'

# --- workspaces -------------------------------------------------------------
@@WORKSPACE_BINDINGS@@

# --- move to another desktop, same screen -----------------------------------
# The trio layout costs you arithmetic: nine workspace numbers for three
# desktops, so "same screen, other desktop" is alt-shift-<n> with (desktop-1)*3
# + column worked out in your head. These do the sum. Column comes from the
# workspace you are on, so the window keeps its panel and only the desktop
# changes. See macos/aerospace/move-to-desktop.sh.
alt-ctrl-1 = 'exec-and-forget ~/.config/aerospace/move-to-desktop.sh 1'
alt-ctrl-2 = 'exec-and-forget ~/.config/aerospace/move-to-desktop.sh 2'
alt-ctrl-3 = 'exec-and-forget ~/.config/aerospace/move-to-desktop.sh 3'

# --- monitors ---------------------------------------------------------------
# Three displays make `focus`/`move` (which cross monitors on their own, by
# geometry) not enough: with the same layout on two panels there is no window in
# the direction you want to travel, and the focus simply doesn't move. These act
# on the DISPLAY instead of on the window neighbourhood.
alt-ctrl-h = 'focus-monitor --wrap-around left'
alt-ctrl-j = 'focus-monitor --wrap-around down'
alt-ctrl-k = 'focus-monitor --wrap-around up'
alt-ctrl-l = 'focus-monitor --wrap-around right'

alt-ctrl-shift-h = 'move-node-to-monitor --wrap-around --focus-follows-window left'
alt-ctrl-shift-j = 'move-node-to-monitor --wrap-around --focus-follows-window down'
alt-ctrl-shift-k = 'move-node-to-monitor --wrap-around --focus-follows-window up'
alt-ctrl-shift-l = 'move-node-to-monitor --wrap-around --focus-follows-window right'

# alt-tab and alt-shift-tab are deliberately UNBOUND: the whole chord belongs to
# AltTab, whose defaults are exactly these two (hold option, tab for next,
# shift-tab for previous). AeroSpace grabs bindings before the focused app sees
# them, so anything here would simply eat the switcher. Pressing alt-tab and
# getting a workspace flip was the bug, not the feature.
#
# Gone with it: `workspace-back-and-forth`. If it is missed, give it a key that
# is not tab.

# --- sub-modes --------------------------------------------------------------
alt-shift-semicolon = 'mode service'

# ===========================================================================
#  Service mode  (alt-shift-; then a key, Esc to leave)
# ===========================================================================
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']   # reset a layout you've mangled
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Join this window into its neighbour's container.
alt-shift-h = ['join-with left',  'mode main']
alt-shift-j = ['join-with down',  'mode main']
alt-shift-k = ['join-with up',    'mode main']
alt-shift-l = ['join-with right', 'mode main']
