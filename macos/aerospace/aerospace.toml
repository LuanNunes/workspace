# AeroSpace — symlinked to ~/.config/aerospace/aerospace.toml
#
# i3-like tiling for macOS, without disabling SIP. Reload after editing:
#   aerospace reload-config
# Full command reference: https://nikitabobko.github.io/AeroSpace/commands
#
# NOTE ON `alt`: AeroSpace grabs its bindings system-wide, BEFORE the focused
# app sees them. So every `alt-<key>` below is permanently unavailable to zsh,
# Neovim and fzf. That's why `alt-c` is deliberately NOT bound — fzf's cd-widget
# owns it. Check this file before adding a binding.

# Schema version of this file. Without it AeroSpace assumes 1 and warns on every
# start. https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

start-at-login = true

# Version 2's one breaking change: v1 inferred which workspaces survive an empty
# screen from the keybindings below, so alt-1…alt-9 persisted for free. In v2 the
# fallback is an empty array and this list is the source of truth — without it,
# a workspace would vanish the moment its last window closes. Keep it in sync
# with the `alt-<n> = 'workspace <n>'` bindings further down.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# macOS "Displays have separate Spaces" fights any tiler: it gives each display
# its own animated Space and re-parents windows behind the WM's back. Turn it
# off in System Settings → Desktop & Dock → Mission Control, then log out.
after-login-command = []

# A colored outline on the focused window — the only way to tell focus apart in
# a gapless tile. Colors are Rosé Pine (iris / overlay), matching Ghostty.
after-startup-command = [
    'exec-and-forget borders active_color=0xffc4a7e7 inactive_color=0xff26233a width=6.0',
]

# ===========================================================================
#  Layout
# ===========================================================================
# 'auto' splits along the longer edge — horizontal on a wide display, vertical
# on the built-in one. Beats hardcoding a direction on a laptop + monitor setup.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# How much of a stacked window peeks out in accordion layout.
accordion-padding = 30

# Mouse follows focus, so the cursor is always over the window you just jumped
# to — otherwise hover-sensitive UI (and scrolling) targets the wrong window.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# ===========================================================================
#  Floating rules
# ===========================================================================
# Anything that is a dialog, a palette or a preferences pane is worse when
# tiled. Find an app's id with: `aerospace list-apps`
#
# THIS BLOCK MUST STAY ABOVE EVERY `[section]` HEADER. `on-window-detected` is a
# root-level key, and in TOML every key after a header belongs to that header's
# table until the next one. Sitting below `[key-mapping]` it was read as
# `key-mapping.on-window-detected` — "Unknown key", and the whole config failed
# to parse, so none of these rules ever ran.
#
# Every id below was read off the installed .app with
# `mdls -name kMDItemCFBundleIdentifier -raw /Applications/<name>.app`. Do the
# same for anything you add — AeroSpace does NOT warn about an id that matches
# no app, the rule just silently never fires. That is what made the browser and
# chat rules below look broken for months.
on-window-detected = [
    { if.app-id = 'com.apple.systempreferences', run = 'layout floating' },
    { if.app-id = 'com.apple.finder',            run = 'layout floating' },
    { if.app-id = 'com.apple.ActivityMonitor',   run = 'layout floating' },
    { if.app-id = 'com.apple.AddressBook',       run = 'layout floating' },
    { if.app-id = 'com.apple.iCal',              run = 'layout floating' },
    { if.app-id = 'com.raycast.macos',           run = 'layout floating' },
    { if.app-id = 'com.jetbrains.toolbox',       run = 'layout floating' },
    { if.app-id = 'dev.orbstack.OrbStack',       run = 'layout floating' },
    { if.app-id = 'org.pqrs.Karabiner-Elements.Settings', run = 'layout floating' },

    # Popups and one-shot panels. Tiling these steals half the screen from real
    # work every time they appear.
    { if.app-id = 'com.bitwarden.desktop',       run = 'layout floating' },
    { if.app-id = 'org.p0deje.Maccy',            run = 'layout floating' },
    { if.app-id = 'com.lujjjh.LinearMouse',      run = 'layout floating' },
    { if.app-id = 'com.ookla.speedtest-macos',   run = 'layout floating' },
    { if.app-id = 'eu.exelban.Stats',            run = 'layout floating' },
    { if.app-id = 'com.apple.UserNotificationCenter', run = 'layout floating' },

    # Send apps to the CENTRE workspace of their desktop — the main 1440p panel,
    # where the work happens. The left and right members of each trio stay free
    # for whatever you put there with alt-shift-<n>. Mirrors the window_rules
    # block in windows/glazewm/config.yaml.
    #
    #   desktop 1 (alt-1) -> ws 2   terminal and editors
    #   desktop 2 (alt-2) -> ws 5   chat and music
    #   desktop 3 (alt-3) -> ws 8   browsers
    #
    # Each slot lists EVERY app you actually open for that job — a slot with one
    # app in it is the same as having no rule the day you switch tools.
    #
    # --focus-follows-window on every rule: without it AeroSpace moves the new
    # window to its workspace and leaves you where you were, so clicking an app
    # in the Dock makes it 'open' onto a screen you cannot see. With it, opening
    # an app takes you to the desktop that app lives on.
    #
    # The cost is at login, when several apps are restored at once: each one that
    # matches a rule pulls focus as its window appears, so the first seconds jump
    # around before settling on whatever launched last.
    { if.app-id = 'com.mitchellh.ghostty',       run = 'move-node-to-workspace 2 --focus-follows-window' },
    { if.app-id = 'com.microsoft.VSCode',        run = 'move-node-to-workspace 2 --focus-follows-window' },
    { if.app-id = 'com.google.android.studio',   run = 'move-node-to-workspace 2 --focus-follows-window' },
    { if.app-id = 'com.jetbrains.intellij',      run = 'move-node-to-workspace 2 --focus-follows-window' },

    # Toggl on the LEFT screen of the work desktop: a timer is something you
    # glance at, so it earns a panel of its own rather than a share of the one
    # you are typing into.
    { if.app-id = 'com.toggl.focus.desktop',     run = 'move-node-to-workspace 1 --focus-follows-window' },

    { if.app-id = 'com.tinyspeck.slackmacgap',   run = 'move-node-to-workspace 5 --focus-follows-window' },
    { if.app-id = 'com.microsoft.teams2',        run = 'move-node-to-workspace 5 --focus-follows-window' },
    { if.app-id = 'net.whatsapp.WhatsApp',       run = 'move-node-to-workspace 5 --focus-follows-window' },
    { if.app-id = 'com.spotify.client',          run = 'move-node-to-workspace 5 --focus-follows-window' },

    # AI clients on the LEFT screen of the chat desktop, mirroring the ChatGPT
    # rule on Windows: read-alongside tools, not the thing you type into.
    { if.app-id = 'com.anthropic.claudefordesktop', run = 'move-node-to-workspace 4 --focus-follows-window' },
    { if.app-id = 'com.openai.codex',            run = 'move-node-to-workspace 4 --focus-follows-window' },

    { if.app-id = 'com.google.Chrome',           run = 'move-node-to-workspace 8 --focus-follows-window' },
    { if.app-id = 'com.apple.Safari',            run = 'move-node-to-workspace 8 --focus-follows-window' },
    { if.app-id = 'org.mozilla.firefoxdeveloperedition', run = 'move-node-to-workspace 8 --focus-follows-window' },
]

# ===========================================================================
#  Sections — everything below here is inside a table, so no root-level key
#  (`on-window-detected`, `start-at-login`, …) may be added past this point.
# ===========================================================================
[workspace-to-monitor-force-assignment]
# Nine workspaces grouped into three "desktops" of three, one per monitor, so
# that the three screens switch as a SINGLE UNIT — alt-1/2/3 below reconfigure
# all of them at once. Ported from windows/glazewm/config.yaml, which solved
# this first and uses the same trio arrangement.
#
#   desktop 1 = 1 2 3   terminal and editors
#   desktop 2 = 4 5 6   chat and music
#   desktop 3 = 7 8 9   browsers
#
# Within each trio the order is left, centre, right. Verified with
# CGDisplayBounds on 2026-09-08 — the desk runs:
#
#   x=-1512  built-in MacBook   1512x982    left
#   x=0      MSI MAG271CQR      2560x1440   centre, and the MAIN display
#   x=2560   MSI MAG271C        1920x1080   right
#
# Note this table is REQUIRED for the trio to work, and not just for tidiness:
# AeroSpace gives every workspace a monitor whether you declare one or not, so
# without it the members of a trio drift onto whatever screen they were last
# shown on and one keypress no longer lands three screens predictably.
#
# The values are REGEXES matched against the monitor name, not literal names.
# `MSI MAG271C` is a prefix of `MSI MAG271CQR`, so an unanchored pattern would
# match the wrong panel — hence `^...$`. Names: aerospace list-monitors
#
# `persistent-workspaces` at the top of this file is what GlazeWM calls
# keep_alive: without it an empty member of a trio would be deactivated, and the
# next alt-<n> would restore only the screens that still had a window on them.

# desktop 1 — terminal and editors
1 = 'built-in'
2 = '^msi mag271cqr$'
3 = '^msi mag271c$'

# desktop 2 — chat and music
4 = 'built-in'
5 = '^msi mag271cqr$'
6 = '^msi mag271c$'

# desktop 3 — browsers
7 = 'built-in'
8 = '^msi mag271cqr$'
9 = '^msi mag271c$'

[gaps]
# `inner` separates tiled windows from each other — keep it, otherwise two
# windows share a hairline and you can't tell where one ends.
# `outer` is the margin against the screen edge, and it's 0 on purpose: with one
# window per workspace (the way this setup is meant to be used) the window then
# fills the display exactly like macOS native fullscreen, minus the native Space
# that breaks every alt-<n> binding.
inner.horizontal = 8
inner.vertical = 8
outer.left = 0
outer.right = 0
outer.bottom = 0
outer.top = 0

[key-mapping]
preset = 'qwerty'

# ===========================================================================
#  Main mode
# ===========================================================================
[mode.main.binding]

# --- launch -----------------------------------------------------------------
alt-enter = 'exec-and-forget open -na Ghostty'

# --- focus / move (i3 hjkl) -------------------------------------------------
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Alternate between the last two WINDOWS. `alt-tab` below does the same for
# workspaces; this one is what you want when two apps share a workspace.
# Costs zsh its `alt-a` (unbound by default, so nothing real is lost) — see the
# note at the top of this file before adding any other alt-<key>.
alt-a = 'focus-back-and-forth'

# --- layout -----------------------------------------------------------------
alt-slash = 'layout tiles horizontal vertical'      # toggle split direction
alt-comma = 'layout accordion horizontal vertical'  # stack them instead
alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'              # pop this window out

# --- window lifecycle -------------------------------------------------------
# alt-w to close and alt-m to minimise, matching win+w and win+m in
# windows/glazewm/config.yaml (and SUPER+W on Omarchy). macOS already has cmd+w,
# but cmd+w is per-app and inconsistent — some apps close a tab with it.
#
# These two cost real zsh bindings, per the warning at the top of this file:
# alt-w was `kill-region` and alt-m was `copy-prev-shell-word`. Neither is a
# daily key here, but `alt-.` (insert-last-word) is untouched and remains the
# one worth keeping.
#
# --quit-if-last-window makes this behave the way it does on Windows and
# Omarchy: the app goes away with its last window, instead of lingering with an
# empty menu bar the way macOS apps normally do. Deliberate — an app you cannot
# see but is still running is exactly the state a tiling WM is meant to avoid.
#
# The cost is real on apps whose window IS the session: the last Ghostty window
# takes its shells with it, and the last browser window ends the browser. cmd+w
# is still there when you want to close a window and keep the app.
alt-w = 'close --quit-if-last-window'

# Minimising in a tiling WM is a one-way door worth knowing about: the window
# leaves the workspace tree entirely and lives in the Dock, and there is no
# AeroSpace binding that brings it back. Use the Dock or AltTab (cmd-tab) to
# restore it.
alt-m = 'macos-native-minimize'

# --- resize -----------------------------------------------------------------
# 150px per press, not 50. The step is in real pixels, so on a display this wide
# a 50px step needs ~10 presses before the split visibly moves — which reads as
# "the binding is broken".
alt-minus = 'resize smart -150'
alt-equal = 'resize smart +150'

# --- workspaces -------------------------------------------------------------
# Switch all three monitors at once — one keypress, one desktop, three screens.
# Each binding focuses the whole trio: left, then right, then CENTRE. Centre
# goes last on purpose, because focusing a workspace follows focus to its
# monitor, so ending there leaves the keyboard on the main 1440p panel rather
# than on whichever screen happened to be last in the list.
alt-1 = ['workspace 1', 'workspace 3', 'workspace 2']   # terminal and editors
alt-2 = ['workspace 4', 'workspace 6', 'workspace 5']   # chat and music
alt-3 = ['workspace 7', 'workspace 9', 'workspace 8']   # browsers

# Escape hatch: move ONE screen to one workspace, leaving the other two where
# they are — for when you want the browser on the right panel while the editors
# stay put. An alt-1/2/3 afterwards re-syncs all three.
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

# --- move to another desktop, same screen -----------------------------------
# The trio layout costs you arithmetic: nine workspace numbers for three
# desktops, so "same screen, other desktop" is alt-shift-<n> with (desktop-1)*3
# + column worked out in your head. These do the sum. Column comes from the
# workspace you are on, so the window keeps its panel and only the desktop
# changes. See macos/aerospace/move-to-desktop.sh.
alt-ctrl-1 = 'exec-and-forget ~/.config/aerospace/move-to-desktop.sh 1'
alt-ctrl-2 = 'exec-and-forget ~/.config/aerospace/move-to-desktop.sh 2'
alt-ctrl-3 = 'exec-and-forget ~/.config/aerospace/move-to-desktop.sh 3'

# --- monitors ---------------------------------------------------------------
# Three displays make `focus`/`move` (which cross monitors on their own, by
# geometry) not enough: with the same layout on two panels there is no window in
# the direction you want to travel, and the focus simply doesn't move. These act
# on the DISPLAY instead of on the window neighbourhood.
alt-ctrl-h = 'focus-monitor --wrap-around left'
alt-ctrl-j = 'focus-monitor --wrap-around down'
alt-ctrl-k = 'focus-monitor --wrap-around up'
alt-ctrl-l = 'focus-monitor --wrap-around right'

alt-ctrl-shift-h = 'move-node-to-monitor --wrap-around --focus-follows-window left'
alt-ctrl-shift-j = 'move-node-to-monitor --wrap-around --focus-follows-window down'
alt-ctrl-shift-k = 'move-node-to-monitor --wrap-around --focus-follows-window up'
alt-ctrl-shift-l = 'move-node-to-monitor --wrap-around --focus-follows-window right'

# Jump back to the previous workspace — the Alt-Tab you actually want.
# If you also installed the AltTab app, move ITS hotkey to cmd-tab so the two
# don't fight over this chord.
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- sub-modes --------------------------------------------------------------
alt-shift-semicolon = 'mode service'

# ===========================================================================
#  Service mode  (alt-shift-; then a key, Esc to leave)
# ===========================================================================
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']   # reset a layout you've mangled
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Join this window into its neighbour's container.
alt-shift-h = ['join-with left',  'mode main']
alt-shift-j = ['join-with down',  'mode main']
alt-shift-k = ['join-with up',    'mode main']
alt-shift-l = ['join-with right', 'mode main']
